# otel-config.yaml
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Exposes OTel metrics on port 8889 in Prometheus format
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "tradepulse"

  # Optional logging for debugging telemetry
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]